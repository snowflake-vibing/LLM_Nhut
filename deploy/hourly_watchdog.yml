name: ⏱️ 24/7 Autonomous LegalTech Watchdog & Agent Regression

on:
  schedule:
    # Kích hoạt tự động mỗi 1 giờ (24/7 kể cả khi máy tính cá nhân tắt nguồn)
    - cron: '0 * * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công qua nút "Run workflow" trên GitHub

jobs:
  watchdog_health_check:
    name: 🛡️ Automated Agent Regression & Cloud Health Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Autonomous Hourly Watchdog & Send Alert
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/hourly_agent_watchdog.py
